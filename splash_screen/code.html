<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-bar {
            position: relative;
            overflow: hidden;
            background: #e0e3df; /* surface-variant */
            height: 4px;
            border-radius: 2px;
        }
        .shimmer-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(27, 109, 36, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-pulse {
            animation: pulse-soft 3s ease-in-out infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>

<script>
        // Simulate a smooth transition after progress bar "completes"
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Agro Mitra: Initializing agricultural neural network...');
            
            // Interaction: Tap logo to see a small reactive pulse
            const logo = document.querySelector('img');
            if (logo) {
                logo.addEventListener('mousedown', () => {
                    logo.style.transform = 'scale(0.95)';
                    logo.style.transition = 'transform 0.1s ease';
                });
                document.addEventListener('mouseup', () => {
                    logo.style.transform = 'scale(1)';
                });
            }
        });
    </script>
