<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .auth-container {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus + label,
        input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
            color: #0d631b;
        }
        .input-group label {
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile font-body-md text-on-surface overflow-x-hidden">
<!-- Atmospheric Background Decoration -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/20 blur-[100px]"></div>
</div>
<!-- Main Auth Canvas -->
<main class="relative z-10 w-full max-w-md auth-container">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-20 h-20 mb-md rounded-[24px] overflow-hidden shadow-sm bg-white p-4">
<img alt="Agro Mitra Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs5vnCyyqweN0RG0XMkYf-BA7S7_-wPiPcMin4_6R4p5Hv4cMnrFlT7ZmfxLCrv2N9nUoUaUqjmEN7PF-USJNZ7kgjomMNJzBZgY7V4jTEUyAmPmYwd_H-FWqltARYKAnUF3NVKAnmsAI4cZB5tr181Bbrwo9HdmHrtawTqJxHTy2MqhuWBFFMScIV2lH0vdKWzWtH1LdLKavSpC01tTjWXejOc25JYCDh9G7UFYd6C1RXchJTmZ5JtlQ"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-xs">
                Welcome to Agro Mitra
            </h1>
<p class="font-body-md text-on-surface-variant max-w-[280px]">
                Empowering your farm with the precision of AI and heritage of nature.
            </p>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-[32px] p-lg md:p-xl">
<!-- Toggle Tab -->
<div class="flex bg-surface-container-low rounded-full p-1 mb-xl relative">
<div class="absolute h-[calc(100%-8px)] top-1 left-1 w-[calc(50%-4px)] bg-white rounded-full shadow-sm transition-all duration-300 ease-out" id="tab-indicator"></div>
<button class="flex-1 py-2 font-label-lg text-label-lg relative z-10 text-primary transition-colors duration-300" id="btn-login" onclick="switchTab('login')">Login</button>
<button class="flex-1 py-2 font-label-lg text-label-lg relative z-10 text-on-surface-variant transition-colors duration-300" id="btn-signup" onclick="switchTab('signup')">Create Account</button>
</div>
<!-- Form Container -->
<form class="space-y-gutter" id="auth-form" onsubmit="event.preventDefault()">
<!-- Email/Phone Input -->
<div class="relative input-group">
<input class="w-full h-14 px-4 pt-4 pb-1 rounded-xl bg-surface-container-low border-none ring-0 focus:ring-2 focus:ring-primary transition-all text-body-lg" id="identifier" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-md text-on-surface-variant origin-left" for="identifier">Email or Phone Number</label>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="relative input-group">
<input class="w-full h-14 px-4 pt-4 pb-1 rounded-xl bg-surface-container-low border-none ring-0 focus:ring-2 focus:ring-primary transition-all text-body-lg" id="password" placeholder=" " type="password"/>
<label class="absolute left-4 top-4 font-body-md text-on-surface-variant origin-left" for="password">Password</label>
<button class="absolute right-4 top-4 text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-2xl font-label-lg text-label-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform duration-100 flex items-center justify-center gap-2 mt-base">
<span id="submit-text">Login to Dashboard</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-base">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-white border border-outline-variant/50 text-on-surface rounded-2xl font-label-lg text-label-lg hover:bg-surface-container-lowest active:scale-[0.98] transition-all duration-100 flex items-center justify-center gap-3">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</form>
</div>
<!-- Footer Help -->
<p class="text-center mt-xl font-label-sm text-label-sm text-on-surface-variant">
            By continuing, you agree to Agro Mitra's <br/>
<a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</p>
</main>
<script>
        function switchTab(mode) {
            const indicator = document.getElementById('tab-indicator');
            const loginBtn = document.getElementById('btn-login');
            const signupBtn = document.getElementById('btn-signup');
            const submitText = document.getElementById('submit-text');
            
            if (mode === 'signup') {
                indicator.style.transform = 'translateX(100%)';
                loginBtn.classList.remove('text-primary');
                loginBtn.classList.add('text-on-surface-variant');
                signupBtn.classList.add('text-primary');
                signupBtn.classList.remove('text-on-surface-variant');
                submitText.textContent = 'Create Free Account';
            } else {
                indicator.style.transform = 'translateX(0)';
                signupBtn.classList.remove('text-primary');
                signupBtn.classList.add('text-on-surface-variant');
                loginBtn.classList.add('text-primary');
                loginBtn.classList.remove('text-on-surface-variant');
                submitText.textContent = 'Login to Dashboard';
            }
        }

        // Simple button active state simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
</body></html>
