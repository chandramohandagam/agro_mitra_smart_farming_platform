<!-- Micro-interactions Script -->
<script>
        function selectVehicle(element) {
            // Remove selection from all cards
            document.querySelectorAll('.vehicle-card').forEach(card => {
                card.classList.remove('selected', 'bg-primary-container/10', 'border-primary');
                card.classList.add('bg-surface-container', 'border-transparent');
                
                const iconContainer = card.querySelector('div:first-child');
                iconContainer.classList.remove('bg-primary-container');
                iconContainer.classList.add('bg-white');
                
                const icon = iconContainer.querySelector('span');
                icon.classList.remove('text-white');
                icon.classList.add('text-primary');
            });

            // Add selection to clicked card
            element.classList.add('selected', 'bg-primary-container/10', 'border-primary');
            element.classList.remove('bg-surface-container', 'border-transparent');
            
            const iconContainer = element.querySelector('div:first-child');
            iconContainer.classList.add('bg-primary-container');
            iconContainer.classList.remove('bg-white');
            
            const icon = iconContainer.querySelector('span');
            icon.classList.add('text-white');
            icon.classList.remove('text-primary');
            
            // Haptic feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }
    </script>
