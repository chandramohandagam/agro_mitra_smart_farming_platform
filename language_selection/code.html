<script>
        function selectLanguage(element) {
            // Remove active state from all options
            document.querySelectorAll('.language-option').forEach(opt => {
                opt.classList.remove('active', 'bg-primary-container', 'text-on-primary-container', 'border-primary');
                opt.classList.add('glass-card');
                
                // Reset radio icon
                const indicator = opt.querySelector('.radio-indicator');
                indicator.classList.remove('border-primary-container');
                indicator.classList.add('border-outline');
                opt.querySelector('.inner-dot').classList.add('scale-0');
            });

            // Set active state for clicked option
            element.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
            element.classList.remove('glass-card');
            
            const indicator = element.querySelector('.radio-indicator');
            indicator.classList.remove('border-outline');
            indicator.classList.add('border-on-primary-container');
            element.querySelector('.inner-dot').classList.remove('scale-0');
            element.querySelector('.inner-dot').classList.add('scale-100');

            // Enable save button
            const saveButton = document.getElementById('saveButton');
            saveButton.removeAttribute('disabled');
            
            // Add a little haptic-like animation
            element.style.transform = 'scale(0.96)';
            setTimeout(() => {
                element.style.transform = '';
            }, 100);
        }

        // Simple Search Filtering Logic
        document.querySelector('input[type="text"]').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const options = document.querySelectorAll('.language-option');
            
            options.forEach(option => {
                const text = option.textContent.toLowerCase();
                if (text.includes(term)) {
                    option.style.display = 'flex';
                } else {
                    option.style.display = 'none';
                }
            });
        });
    </script>
